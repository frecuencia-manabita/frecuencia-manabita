<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frecuencia Manabita - En Vivo</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192x192.png" type="image/png">
    
    <link rel="stylesheet" href="estilo.css">

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#c6b800">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Radio Station">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
        
</head>
<body>

    <!-- ------------------------------------------------ -->
    <!-- Navbar Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container-fluid">

            <a class="navbar-brand d-flex align-items-center" href="#" onclick="mostrarInicio()">
                <i class="fas fa-radio me-2" style="color: var(--primary-color);"></i>
                <strong>Frecuencia Manabita</strong>
            </a>

            <!-- ------------------------------------------------ -->
            <!-- Menú SOLO escritorio -->

            <div class="d-none d-lg-flex align-items-center ms-auto">

                <a href="#"
                id="btnInicioDesktop"
                class="nav-link active text-warning px-3"
                onclick="mostrarInicio()">

                    <i class="fas fa-home fa-lg"></i>
                    <small class="ms-1">Inicio</small>

                </a>

                <a href="#"
                id="btnNoticiasDesktop"
                class="nav-link px-3"
                onclick="mostrarNoticias()">

                    <i class="fas fa-newspaper fa-lg"></i>
                    <small class="ms-1">Noticias</small>

                </a>

                <a href="#"
                id="btnAjustesDesktop"
                class="nav-link px-3"
                onclick="mostrarAjustes()">

                    <i class="fas fa-cog fa-lg"></i>
                    <small class="ms-1">Ajustes</small>

                </a>

            </div>

        </div>
    </nav>


    <div class="background-blur"></div>

    <div class="content">

    <!-- ------------------------------------------------ -->
    <!-- Interfaz del Reproductor -->

        <div class="main-player text-center" id="radio">
            
            <img src="icons/LOGO1.jpeg"
                alt="Frecuencia Manabita" class="album-art mx-auto" id="albumArt">
            
            <!-- Estado Dinámico -->
            <div class="mb-3" id="liveStatus"></div>
            
            <h2 class="station-name text-warning">FRECUENCIA MANABITA</h2>
            <!-- <h4 class="song-title" id="songTitle">Cargando transmisión...</h4> -->
            <p class="transmitting mb-4" id="artistName">Desde Ecuador</p>

            <!-- <p class="status-text mb-3" id="statusText"></p> -->

            <!-- Controles -->
            <div class="d-flex justify-content-center align-items-center gap-4 mb-4">

                <button id="playButton" class="btn btn-warning btn-play shadow-lg" onclick="togglePlay()">
                    <i class="fas fa-play" id="playIcon"></i>
                </button>
                

            </div>

            <!-- Volumen -->
            <div class="px-3">
                <div class="d-flex align-items-center gap-3">
                    
                    <button class="btn btn-volume" onclick="setMute()">
                        <i class="fas fa-volume-mute fa-1x"></i>
                    </button>
                    
                    <!-- <i class="fas fa-volume-down text-muted"></i> -->
            
                    <input type="range"
                        class="volume-slider"
                        id="volumeSlider"
                        min="0"
                        max="1"
                        step="0.01"
                        value="0.8">
            
                    <button class="btn btn-volume" onclick="setMaxVolume()">
                        <i class="fas fa-volume-up fa-1x"></i>
                    </button>
                    <!-- <i class="fas fa-volume-up text-muted"></i> -->
                </div>
            
                <div class="text-center mt-1">
                    <small class="transmitting mb-4" id="volumeValue">80%</small>
                </div>
            </div>

        </div>
    </div>

    <!-- ------------------------------------------------ -->
    <!-- espacio de noticias -->

    <div id="contenido"></div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav py-3 d-lg-none">
        <div class="container">
            <div class="row text-center">

                <div class="col-4">
                    <a href="#"
                    id="btnInicio"
                    class="nav-link active text-warning"
                    onclick="mostrarInicio()">

                        <i class="fas fa-home fa-lg"></i>
                        <small>Inicio</small>

                    </a>
                </div>

                <div class="col-4">
                    <a href="#"
                    id="btnNoticias"
                    class="nav-link"
                    onclick="mostrarNoticias()">

                        <i class="fas fa-newspaper fa-lg"></i>
                        <small>Noticias</small>

                    </a>
                </div>

                <div class="col-4">
                    <a href="#"
                    id="btnAjustes"
                    class="nav-link"
                    onclick="mostrarAjustes()">

                        <i class="fas fa-cog fa-lg"></i>
                        <small>Ajustes</small>

                    </a>
                </div>

            </div>
        </div>
    </nav>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // Registrar Service Worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((reg) => console.log("Service Worker registrado:", reg.scope))
            .catch((err) => console.log("Error registrando SW:", err));
        });
      }
    </script>
    
</body>
</html>
